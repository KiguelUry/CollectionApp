<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Paloma — tes collections, au même endroit.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Paloma">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Paloma</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: linear-gradient(160deg, #1A1033 0%, #311B92 48%, #5E35B1 100%);
    }
    .paloma-boot {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 18px;
      color: #FFF6F0;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      z-index: 0;
      pointer-events: none;
    }
    .paloma-boot .mark {
      width: 72px;
      height: 72px;
      border-radius: 22px;
      background: rgba(255,246,240,0.16);
      border: 1px solid rgba(255,246,240,0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .paloma-boot .name {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.4px;
    }
  </style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="paloma-boot" aria-hidden="true">
    <div class="mark">P</div>
    <div class="name">Paloma</div>
  </div>
  <!-- Requis par supabase_flutter (passkeys) sur le web -->
  <script src="passkeys_bundle.js" type="application/javascript"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
