<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Collection — Paloma</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --accent: #673AB7;
      --accent-soft: #E8E0F5;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      margin: 0;
      background: #f6f4fa;
      color: #1a1a1a;
      line-height: 1.5;
    }
    .hero {
      background: linear-gradient(135deg, var(--accent), #512DA8);
      color: #fff;
      padding: 2rem 1.25rem 2.5rem;
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 0 1rem 3rem; }
    .columns {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      align-items: start;
    }
    @media (min-width: 860px) {
      .columns { grid-template-columns: 1fr 1fr; }
    }
    .profile {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: cover;
      background: rgba(255,255,255,0.2);
      border: 3px solid rgba(255,255,255,0.35);
    }
    .avatar-fallback {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 800;
    }
    h1 { margin: 0; font-size: 1.5rem; }
    .bio { margin: 0.5rem 0 0; opacity: 0.9; font-size: 0.95rem; }
    .badge {
      display: inline-block;
      margin-top: 0.75rem;
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      background: rgba(255,255,255,0.2);
      font-size: 0.8rem;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 1.25rem;
      margin-top: 1rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    h2 {
      font-size: 1rem;
      margin: 0 0 0.75rem;
      color: var(--accent);
    }
    h3 {
      font-size: 0.9rem;
      margin: 1rem 0 0.35rem;
      color: #444;
    }
    h3 .n { color: #888; font-weight: normal; }
    ul { margin: 0; padding-left: 1.2rem; }
    li { margin: 0.2rem 0; }
    .meta { color: #666; font-size: 0.85em; }
    .series-toggle {
      background: none;
      border: 0;
      padding: 0;
      font: inherit;
      color: inherit;
      cursor: pointer;
      text-align: left;
    }
    .series-toggle + ul { margin-top: 0.2rem; }
    .avatar-slot { position: relative; width: 72px; height: 72px; flex: none; }
    .avatar-slot .avatar, .avatar-slot .avatar-fallback {
      position: absolute; inset: 0;
    }
    .state {
      text-align: center;
      padding: 3rem 1rem;
      color: #666;
    }
    .state.error { color: #c62828; }
    footer {
      text-align: center;
      font-size: 0.8rem;
      color: #888;
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="state">Chargement…</div>
  </div>

  <script>
    // Même projet que l'app (.env) — clé anon publique, données protégées par la RPC.
    const SUPABASE_URL = 'https://jfudrneoblsiingjqsio.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_lyB3xo2ORzY6zwrbkn5g3A_7p5ddw7n';

    const CATEGORY_LABELS = {
      boardgame: 'Jeux de société',
      book: 'Livres',
      card: 'Cartes',
      car: 'Voitures',
      stamp: 'Timbres',
      coin: 'Monnaies',
      media: 'Vinyles / CD',
      lego: 'Lego & maquettes',
      watch: 'Montres',
      videogame: 'Jeux vidéo',
      movie: 'Films',
    };

    const params = new URLSearchParams(location.search);
    const token = params.get('t') || params.get('token');

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    const ACTIVE_CATEGORIES = new Set([
      'boardgame', 'book', 'manga', 'card', 'media', 'lego', 'videogame', 'movie'
    ]);

    function isListedCategory(cat) {
      return ACTIVE_CATEGORIES.has(cat || 'boardgame');
    }

    function isActive(item) {
      return !item.is_wishlist && !item.is_sold && !item.is_for_sale
        && isListedCategory(item.category);
    }

    function decodeEntities(text) {
      const node = document.createElement('textarea');
      node.innerHTML = String(text || '');
      return node.value.replace(/\s+/g, ' ').trim();
    }

    function dedupeItems(list) {
      const map = new Map();
      for (const item of list) {
        const title = decodeEntities(item.title);
        const key = [
          item.category || '',
          item.is_wishlist ? 'w' : 'o',
          title.toLowerCase(),
        ].join('|');
        const qty = Number(item.quantity) || 1;
        if (!map.has(key)) {
          map.set(key, { ...item, title, quantity: qty });
        } else {
          map.get(key).quantity += qty;
        }
      }
      return [...map.values()];
    }

    function bookSeriesName(title) {
      const match = String(title).match(/^(.*?)\s+-\s+tome\b/i);
      return match ? match[1].trim() : null;
    }

    function itemLine(item) {
      let line = escapeHtml(item.title);
      if (item.is_expansion) line += ' <span class="meta">(Extension)</span>';
      const meta = item.metadata || {};
      const extra = [meta.set_name || meta.extension, meta.rarity]
        .map((v) => (v == null ? '' : String(v).trim()))
        .filter(Boolean);
      if (extra.length) line += ` <span class="meta">(${escapeHtml(extra.join(' · '))})</span>`;
      if (item.quantity > 1) line += ` <span class="meta">×${item.quantity}</span>`;
      if (item.rating != null) line += ` <span class="meta">★ ${Number(item.rating).toFixed(1)}</span>`;
      return `<li>${line}</li>`;
    }

    function renderBookList(list) {
      const singles = [];
      const series = new Map();
      for (const item of list) {
        const name = bookSeriesName(item.title);
        if (!name) {
          singles.push(item);
          continue;
        }
        if (!series.has(name)) series.set(name, []);
        series.get(name).push(item);
      }
      let html = '<ul>';
      for (const item of singles) {
        if (bookSeriesName(item.title)) continue;
        html += itemLine(item);
      }
      for (const [name, tomes] of series) {
        tomes.sort((a, b) => a.title.localeCompare(b.title, 'fr', { numeric: true }));
        if (tomes.length < 2) {
          html += itemLine(tomes[0]);
          continue;
        }
        const id = 'series-' + Math.random().toString(36).slice(2);
        html += `<li><button type="button" class="series-toggle" aria-expanded="false" data-target="${id}">▶ ${escapeHtml(name)} (${tomes.length} tomes)</button><ul id="${id}" hidden>`;
        for (const tome of tomes) html += itemLine(tome);
        html += '</ul></li>';
      }
      html += '</ul>';
      return html;
    }

    function renderSection(title, items) {
      if (!items.length) return '';
      const byCat = {};
      for (const item of items) {
        const cat = item.category === 'manga' ? 'book' : (item.category || 'boardgame');
        if (!isListedCategory(item.category)) continue;
        if (!byCat[cat]) byCat[cat] = [];
        byCat[cat].push(item);
      }
      let html = `<div class="card"><h2>${escapeHtml(title)}</h2>`;
      for (const [cat, list] of Object.entries(byCat).sort((a, b) =>
        (CATEGORY_LABELS[a[0]] || a[0]).localeCompare(CATEGORY_LABELS[b[0]] || b[0])
      )) {
        const label = CATEGORY_LABELS[cat] || cat;
        const counted = list.filter((item) => !item.is_expansion).length;
        html += `<h3>${escapeHtml(label)} <span class="n">(${counted})</span></h3>`;
        html += cat === 'book' ? renderBookList(list) : `<ul>${list.map(itemLine).join('')}</ul>`;
      }
      html += '</div>';
      return html;
    }

    async function main() {
      const app = document.getElementById('app');
      if (!token) {
        app.innerHTML = '<div class="state error">Lien invalide (token manquant).</div>';
        return;
      }

      const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: {
          persistSession: false,
          autoRefreshToken: false,
          detectSessionInUrl: false,
        },
      });
      const { data, error } = await client.rpc('get_public_showcase', { p_token: token });

      if (error || !data || data.error) {
        const msg = data?.error === 'not_found'
          ? 'Cette vitrine n\'existe pas ou n\'est plus publique.'
          : 'Impossible de charger la collection.';
        app.innerHTML = `<div class="state error">${msg}</div>`;
        return;
      }

      const accent = data.accent_color || '#673AB7';
      document.documentElement.style.setProperty('--accent', accent);
      document.documentElement.style.setProperty('--accent-soft', accent + '22');
      document.title = `Collection de ${data.username}`;

      const params = new URLSearchParams(location.search);
      const showOwnedOnly = params.get('show') === 'owned';
      const items = Array.isArray(data.items) ? data.items : [];
      const owned = dedupeItems(items.filter(isActive));
      const wishlist = showOwnedOnly
        ? []
        : dedupeItems(items.filter((i) => i.is_wishlist && isListedCategory(i.category)));

      const initial = (data.username || '?')[0].toUpperCase();
      const avatarUrl = typeof data.avatar_url === 'string' ? data.avatar_url.trim() : '';
      const avatar = /^https?:\/\//i.test(avatarUrl)
        ? `<div class="avatar-slot"><div class="avatar-fallback">${escapeHtml(initial)}</div><img class="avatar" src="${escapeHtml(avatarUrl)}" alt="" onerror="this.remove()"></div>`
        : `<div class="avatar-fallback">${escapeHtml(initial)}</div>`;

      const collectionCard = renderSection('Ma collection', owned);
      const wishlistCard = wishlist.length ? renderSection('Wishlist', wishlist) : '';

      app.innerHTML = `
        <header class="hero">
          <div class="wrap">
            <div class="profile">
              ${avatar}
              <div>
                <h1>Collection de ${escapeHtml(data.username)}</h1>
                ${data.bio ? `<p class="bio">${escapeHtml(data.bio)}</p>` : ''}
              </div>
            </div>
          </div>
        </header>
        <main class="wrap">
          <div class="columns">
            ${collectionCard || '<div class="card"><p>Aucun objet pour l\'instant.</p></div>'}
            ${wishlistCard}
          </div>
          <footer>
            Liste en lecture seule — pour la version interactive, installe l'app Paloma.
          </footer>
        </main>
      `;
      app.querySelectorAll('.series-toggle').forEach((button) => {
        button.addEventListener('click', () => {
          const list = document.getElementById(button.dataset.target);
          if (!list) return;
          const open = list.hidden;
          list.hidden = !open;
          button.setAttribute('aria-expanded', open ? 'true' : 'false');
          button.textContent = (open ? '▼ ' : '▶ ') + button.textContent.replace(/^[▶▼]\s/, '');
        });
      });
    }

    main().catch(() => {
      document.getElementById('app').innerHTML =
        '<div class="state error">Erreur réseau.</div>';
    });
  </script>
</body>
</html>
