name: Deploy web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Déploiement Pages officiel (Actions) — évite la course peaceiris → gh-pages
# qui laissait des déploiements bloqués en "updating_pages".
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Ne pas annuler un deploy en cours : sinon Pages reste "in progress"
  # et les push suivants échouent avec "cancel … first".
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare .env from GitHub Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          BGG_APPLICATION_TOKEN: ${{ secrets.BGG_APPLICATION_TOKEN }}
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          REBRICKABLE_API_KEY: ${{ secrets.REBRICKABLE_API_KEY }}
        run: bash scripts/write_ci_env.sh

      - name: Build web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ]; then
            SUPABASE_URL="https://jfudrneoblsiingjqsio.supabase.co"
          fi
          if [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            SUPABASE_ANON_KEY="sb_publishable_lyB3xo2ORzY6zwrbkn5g3A_7p5ddw7n"
          fi
          echo "Building key_len=${#SUPABASE_ANON_KEY} gb_key_len=${#GOOGLE_BOOKS_API_KEY}"
          flutter build web --release --base-href "/CollectionApp/" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=GOOGLE_BOOKS_API_KEY="${GOOGLE_BOOKS_API_KEY:-}"

      - name: Strip missing flutter.js.map sourcemap refs
        run: |
          find build/web -type f \( -name 'flutter.js' -o -name 'flutter_bootstrap.js' -o -name '*.js' \) \
            -print0 | xargs -0 sed -i '/sourceMappingURL=flutter\.js\.map/d' || true
          : > build/web/flutter.js.map

      - name: Add .nojekyll for GitHub Pages
        run: touch build/web/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
