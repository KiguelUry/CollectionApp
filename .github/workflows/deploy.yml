name: Deploy web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Push du build sur la branche gh-pages (source Pages : branche gh-pages / root).
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare .env from GitHub Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          BGG_APPLICATION_TOKEN: ${{ secrets.BGG_APPLICATION_TOKEN }}
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          REBRICKABLE_API_KEY: ${{ secrets.REBRICKABLE_API_KEY }}
        run: bash scripts/write_ci_env.sh

      - name: Build web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
        run: |
          set -euo pipefail
          # Secrets vides ("") ne déclenchent pas ${VAR:-default} → normaliser.
          if [ -z "${SUPABASE_URL:-}" ]; then
            SUPABASE_URL="https://jfudrneoblsiingjqsio.supabase.co"
          fi
          if [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            SUPABASE_ANON_KEY="sb_publishable_lyB3xo2ORzY6zwrbkn5g3A_7p5ddw7n"
          fi
          echo "Building key_len=${#SUPABASE_ANON_KEY} gb_key_len=${#GOOGLE_BOOKS_API_KEY}"
          flutter build web --release --base-href "/CollectionApp/" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=GOOGLE_BOOKS_API_KEY="${GOOGLE_BOOKS_API_KEY:-}"

      - name: Strip missing flutter.js.map sourcemap refs
        run: |
          # Évite les 404 console (flutter.js.map absent du build release).
          find build/web -type f \( -name 'flutter.js' -o -name 'flutter_bootstrap.js' -o -name '*.js' \) \
            -print0 | xargs -0 sed -i '/sourceMappingURL=flutter\.js\.map/d' || true
          # Fichier vide optionnel si un cache demande encore le .map
          : > build/web/flutter.js.map

      - name: Add .nojekyll for GitHub Pages
        run: touch build/web/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          publish_branch: gh-pages
